name: ci
on:
  push:
    branches:
      - master
      - emily/ghc-9.14.x
  pull_request: {} # Validate all PRs
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        ghc: ['9.6.7', '9.8.4', '9.10.3', '9.12.4', '9.14.1']
        include:
        - os: macOS-latest
          ghc: '9.14.1'
    steps:
    - uses: actions/checkout@v7
    - uses: haskell-actions/setup@v2.12.1
      id: setup-haskell-cabal
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: 'latest'
    - name: Update cabal package database
      run: cabal update
    - uses: actions/cache@v6
      name: Cache cabal stuff
      with:
        path: |
          ${{ steps.setup-haskell-cabal.outputs.cabal-store }}
        key: ${{ runner.os }}-${{ runner.arch }}-ghc-${{ steps.setup-haskell-cabal.outputs.ghc-version }}-cabal-${{ steps.setup-haskell-cabal.outputs.cabal-version }}-${{ hashFiles('**/*.cabal', 'cabal.project') }}
    - name: Test
      run: |
        cabal sdist -z -o .
        cabal get base64-*.tar.gz
        cd base64-*/
        cabal build base64:tests --enable-tests --enable-benchmarks
        cabal test --enable-tests --enable-benchmarks --test-show-details=direct all
    - name: Bench
      run: |
        cd base64-*/
        cabal bench --enable-tests --enable-benchmarks --benchmark-option=-l all
    - name: Haddock
      run: |
        cd base64-*/
        cabal haddock all
    - name: Cabal check
      run: |
        cd base64-*/
        cabal check

  bounds-checking:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: haskell-actions/setup@v2.12.1
      id: setup-haskell-cabal
      with:
        ghc-version: '9.14.1'
        cabal-version: 'latest'
    - name: Update cabal package database
      run: cabal update
    - uses: actions/cache@v6
      name: Cache cabal stuff
      with:
        path: |
          ${{ steps.setup-haskell-cabal.outputs.cabal-store }}
        key: ${{ runner.os }}-${{ runner.arch }}-bounds-ghc-${{ steps.setup-haskell-cabal.outputs.ghc-version }}-cabal-${{ steps.setup-haskell-cabal.outputs.cabal-version }}-${{ hashFiles('**/*.cabal', 'cabal.project') }}
    - name: Test
      run: cabal test --ghc-options='-fcheck-prim-bounds -fno-ignore-asserts'

